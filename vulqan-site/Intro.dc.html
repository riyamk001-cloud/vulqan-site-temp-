<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/vulqan-platform-design-system-5affcd8f-82db-4ca5-98af-891975dede02/tokens/fonts.css">
<link rel="stylesheet" href="_ds/vulqan-platform-design-system-5affcd8f-82db-4ca5-98af-891975dede02/tokens/palette.css">
<link rel="stylesheet" href="_ds/vulqan-platform-design-system-5affcd8f-82db-4ca5-98af-891975dede02/tokens/colors.css">
<link rel="stylesheet" href="_ds/vulqan-platform-design-system-5affcd8f-82db-4ca5-98af-891975dede02/tokens/themes.css">
<link rel="stylesheet" href="_ds/vulqan-platform-design-system-5affcd8f-82db-4ca5-98af-891975dede02/tokens/typography.css">
<link rel="stylesheet" href="_ds/vulqan-platform-design-system-5affcd8f-82db-4ca5-98af-891975dede02/tokens/density.css">
<link rel="stylesheet" href="_ds/vulqan-platform-design-system-5affcd8f-82db-4ca5-98af-891975dede02/tokens/layout.css">
<link rel="stylesheet" href="_ds/vulqan-platform-design-system-5affcd8f-82db-4ca5-98af-891975dede02/tokens/utilities.css">
<link rel="stylesheet" href="_ds/vulqan-platform-design-system-5affcd8f-82db-4ca5-98af-891975dede02/styles.css">
<script src="_ds/vulqan-platform-design-system-5affcd8f-82db-4ca5-98af-891975dede02/_ds_bundle.js"></script>
<script>window.OM_SCENES = '[{"name":"Swarm","dur":14.6,"desc":"Opening crawl: the buzzwords scroll up a tilted plane in date order and recede"},{"name":"Settle","dur":9,"desc":"The field freezes and blackens; three panels break out of it"},{"name":"Land","dur":4.6,"desc":"The panels sink away and the piece lands on three lines ending on: Vulqanize your data."}]';</script>
<script>window.OM_PLAYBACK = '{"mode":"times","count":1}';</script>
<style>@media (max-width:1040px){.vq-nav-links{display:none !important}}
html,body{margin:0;padding:0;background:#05080f;}*{box-sizing:border-box;}a{color:#1784f1;text-decoration:none;}a:hover{color:#7db3ee;}</style>
</helmet>

<div style="{{ shellStyle }}">
  <div style="position:absolute;left:0;right:0;top:0;height:calc(100% + 52px)">

    <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
      <x-import component-from-global-scope="CompositionStage" from="./animations-v3.jsx ./buzz-scene.jsx" width="{{ 1600 }}" height="{{ 900 }}" scenes="{{ scenes }}" playback="{{ playback }}" bg="#05080f" hint-size="100%,100%">
        <x-import component-from-global-scope="Piece" hint-size="100%,100%"></x-import>
      </x-import>
    </sc-if>
  </div>
  <div style="position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:28px clamp(16px,3vw,56px);background:rgba(5,8,15,.92);border-bottom:1px solid #1d2d5a;font-family:'Inter',system-ui,sans-serif">
    <a href="#" onClick="{{ home }}" aria-label="Vulqan home" style="display:flex;align-items:center">
      <img src="assets/vulqan-logo.png" alt="Vulqan" style="height:22px;width:auto;display:block">
    </a>
    <nav class="vq-nav-links" style="display:flex;align-items:center;gap:clamp(12px,2.2vw,36px);flex:0 0 auto;flex-wrap:nowrap">
      <sc-for list="{{ nav }}" as="item" hint-placeholder-count="6">
        <a href="#" onClick="{{ item.go }}" style="font-size:17px;font-weight:500;white-space:nowrap;color:#95989c;text-decoration:none;padding:6px 2px;border-bottom:1px solid transparent;transition:color .15s linear" style-hover="color:#ffffff">{{ item.label }}</a>
      </sc-for>
    </nav>
    <a href="mailto:info@vulqan.ai" style="flex:none;background:#457bcc;color:#fff;border:1px solid #457bcc;border-radius:4px;padding:9px 16px;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none;transition:background .15s linear" style-hover="background:#1784f1;color:#ffffff">Book a call</a>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;z-index:6;padding:28px clamp(20px,4vw,56px);border-top:1px solid #1d2d5a;background:rgba(5,8,15,.92);font-family:'Inter',system-ui,sans-serif">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
      <a href="https://www.linkedin.com/company/vulqan-ai/" aria-label="LinkedIn" style="width:30px;height:30px;border-radius:4px;border:1px solid #1d2d5a;display:flex;align-items:center;justify-content:center;color:#95989c;font-weight:600;font-size:12.5px;text-decoration:none;transition:border-color .15s linear,color .15s linear" style-hover="border-color:#7db3ee;color:#ffffff">in</a>
      <a href="mailto:info@vulqan.ai" style="font-size:14px;color:#95989c;text-decoration:none" style-hover="color:#ffffff">info@vulqan.ai</a>
    </div>
  </div>
  <div style="position:absolute;right:clamp(16px,3vw,56px);bottom:114px;z-index:7">
    <button type="button" onClick="{{ cueAction }}" style="background:rgba(13,20,36,.92);border:1px solid #1d2d5a;color:#95989c;font-family:'Roboto Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:100px;cursor:pointer;white-space:nowrap" style-hover="border-color:#7db3ee;color:#ffffff">{{ cueLabel }}</button>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;onDone&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { ready: false, ended: false, reloading: false };

  componentDidMount() {
    // the inline scene-list script may land after the first render
    if (!window.OM_SCENES) {
      this.wait = setInterval(() => {
        if (window.OM_SCENES) { clearInterval(this.wait); this.setState({ ready: true }); this.arm(); }
      }, 30);
      setTimeout(() => clearInterval(this.wait), 3000);
    }
    this.arm();
  }

  // read the real authored length off the scene list, so retiming a scene in the
  // timeline can never leave the handoff early or late
  arm() {
    let total = 17.6;
    try {
      const scenes = JSON.parse(window.OM_SCENES || '[]');
      if (scenes.length) total = scenes.reduce((n, sc) => n + (Number(sc.dur) || 0), 0);
    } catch (e) {}
    clearTimeout(this.fadeTimer);
    clearTimeout(this.timer);
    // the intro IS the landing page: it holds on its final frame instead of
    // handing off. The only thing the end of the run changes is the cue button,
    // which becomes a replay control.
    this.timer = setTimeout(() => {
      if (!this.dead) this.setState({ ended: true });
    }, (total + 0.4) * 1000);
  }

  replay = () => {
    // drop the stage and remount it a frame later: the composition clock
    // restarts from zero without touching any of the scene authoring
    this.setState({ ended: false, reloading: true });
    setTimeout(() => {
      if (this.dead) return;
      this.setState({ reloading: false });
      this.arm();
    }, 60);
  };

  componentWillUnmount() {
    this.dead = true;
    clearInterval(this.wait);
    clearTimeout(this.timer);
    clearTimeout(this.fadeTimer);
  }

  skip = () => {
    clearTimeout(this.timer);
    clearTimeout(this.fadeTimer);
    if (this.props.onDone) this.props.onDone();
  };

  goTo = id => e => {
    if (e) e.preventDefault();
    // inside the shell the intro hands the page over; opened on its own it
    // navigates to that page's file, so the nav behaves like the real site
    if (!this.props.onDone) {
      const FILES = {
        home: 'Landing.dc.html', approach: 'Our-approach.dc.html',
        perspective: 'Perspective.dc.html', product: 'Product.dc.html',
        usecases: 'Use-cases.dc.html', impact: 'Impact.dc.html', people: 'People.dc.html', tryit: 'Try-it.dc.html'
      };
      if (FILES[id]) window.location.href = FILES[id];
      return;
    }
    this.props.onDone(id);
  };

  renderVals() {
    return {
      scenes: window.OM_SCENES,
      playback: window.OM_PLAYBACK,
      ready: !!window.OM_SCENES && !this.state.reloading,
      cueLabel: this.state.ended ? 'Play \u21ba' : 'Skip \u2192',
      cueAction: this.state.ended ? this.replay : this.skip,
      home: this.goTo('home'),
      nav: [
        ['impact', 'Our impact'], ['approach', 'Our approach'], ['perspective', 'Our perspective'],
        ['product', 'The product'], ['usecases', 'The possibilities'],
        ['people', 'The team'], ['tryit', 'Try it']
      ].map(([id, label]) => ({ id, label, go: this.goTo(id) })),
      shellStyle: {
        position: 'fixed', inset: 0, background: '#05080f', overflow: 'hidden',
        opacity: this.state.fading ? 0 : 1, transition: 'opacity .4s linear'
      },
      skip: this.skip
    };
  }
}

</script>
</body>
</html>
